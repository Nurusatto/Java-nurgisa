debug: false
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
spring:
  application:
    name: fixflow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fixflow}
    username: ${POSTGRES_USER:fixflow}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
fixflow:
  demo-enabled: ${FIXFLOW_DEMO_ENABLED:false}
  bootstrap-owner:
    enabled: ${FIXFLOW_BOOTSTRAP_OWNER_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
